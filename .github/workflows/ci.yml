name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───── Backend: build + tests, including Modulith boundary verification ─────
  api:
    name: API (Maven + Modulith)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (includes ModularityTests boundary verification)
        run: ./mvnw -B -ntp verify
        working-directory: apps/api
        # Integration tests use Testcontainers; Docker is available on
        # ubuntu-latest GitHub runners out of the box.

      - name: Upload Modulith docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-modulith-docs
          path: apps/api/target/spring-modulith-docs/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/target/surefire-reports/
          if-no-files-found: ignore

  # ───── Frontends: type-check + build both Next.js apps ─────
  frontends:
    name: Frontends (Next.js type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # pnpm version comes from the "packageManager" field in package.json
        # (specifying it here too makes pnpm/action-setup@v4 fail).

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -r --if-present run typecheck

      # `next lint` with --max-warnings 0 in every app. Until ESLint was added
      # the lint scripts dropped into next's interactive setup prompt, so this
      # step could never have run.
      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Build storefront
        run: pnpm --filter @town-basket/storefront build

      - name: Build admin
        run: pnpm --filter @town-basket/admin build

      # The delivery-agent PWA is in the workspace and was type-checked but
      # never built here, so a build-only break in it reached main unnoticed.
      - name: Build delivery
        run: pnpm --filter @town-basket/delivery build

      # Runs the storefront's standalone build and asks Chrome, through
      # Lighthouse, whether it is still installable. Guards the manifest, the
      # icons and the service worker together — none of which the type-check or
      # the build can check, because a storefront that has quietly stopped being
      # a PWA still compiles perfectly. Needs the build above.
      #
      # ubuntu-latest ships Chrome, which is what Lighthouse drives.
      - name: PWA installability gate (storefront)
        run: node scripts/pwa-gate.mjs
