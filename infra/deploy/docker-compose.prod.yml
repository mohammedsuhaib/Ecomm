# Production stack (DigitalOcean droplet). Skeleton — finalised in M6.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are pre-built and pushed by CI; ${REGISTRY} and ${TAG} come from the
# root-restricted .env on the droplet (never committed).
#
# Every var this stack CANNOT run correctly without uses ${VAR:?message}, so a
# missing or blank value stops `docker compose up` with a message naming the var
# instead of starting a half-configured production stack. Optional vars use
# ${VAR:-default} and say what the default means.
#
# ───── Memory budget ─────
# Six containers share ONE droplet, so each one's ceiling is stated here rather
# than left to chance. Unbounded, any single container can take the whole box
# and the kernel picks the victim: the API's heap grows to 25% of the droplet,
# the Next.js apps take what they like, and the first busy evening ends with an
# OOM-killed container that looks like a performance problem but is a budgeting
# one. The API's heap is derived from its limit (MaxRAMPercentage=70 in
# apps/api/Dockerfile), so raising API_MEM_LIMIT raises the heap with it.
#
# Defaults total ~3.1 GB of the planned 4 GB droplet (ARCHITECTURE §8), leaving
# ~900 MB for the OS, Docker itself and the page cache. On a 2 GB box, lower
# every one of these in .env; if you uncomment the self-hosted postgres service
# below, give it its own limit and take that out of the API's share.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Reverse proxy + TLS only; it streams rather than buffers.
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - storefront
      - admin
      - delivery

  api:
    image: ${REGISTRY:?set REGISTRY in .env}/town-basket-api:${TAG:-latest}
    restart: unless-stopped
    # The JVM reads this limit and takes 70% of it as max heap (~1 GB here), so
    # this single number sizes both the container and the heap. Everything
    # non-heap — metaspace, code cache, 200 Tomcat thread stacks, the 16 Hikari
    # connections' buffers — comes out of the remaining 30%.
    mem_limit: ${API_MEM_LIMIT:-1500m}
    environment:
      # Recommended: point at DO Managed Postgres. A blank value does NOT fall
      # back to application.yml's localhost default — Spring treats an empty env
      # var as "set", so the datasource would be misconfigured rather than local.
      DB_URL: ${DB_URL:?set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # App-issued JWT signing key — MUST be a real, random, >=32-byte secret
      # (the in-repo dev default is insecure and only for local dev).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>=32 random bytes)}
      # Set to your Firebase projectId to enable REAL phone-OTP (disables the
      # offline dev fake verifier). Blank is refused at two levels and is never
      # a silent downgrade to the fake: the guard below stops `compose up` naming
      # the var, and if the var reaches the API blank anyway PhoneVerifierMode
      # fails the boot with the property name and the fix.
      # To intentionally run the offline fake, comment this line out.
      TOWNBASKET_IDENTITY_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env (or comment out this line to run the offline fake verifier)}
      # Browser origins allowed to call the API. WITHOUT this the API keeps
      # application.yml's localhost defaults and every request from the real
      # domains is blocked by CORS — the whole site appears broken.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://shop.town-basket.com,https://admin.town-basket.com,https://delivery.town-basket.com}
      # The API is `expose`d, not published — it is reachable ONLY through Caddy,
      # which overwrites X-Forwarded-For with the real peer. Trusting it here is
      # what makes the auth rate limit per-CLIENT; left false, every request
      # looks like it comes from Caddy and one visitor can exhaust the window
      # for everyone. Do NOT set this true anywhere the API is directly reachable.
      TOWNBASKET_RATELIMIT_TRUST_FORWARDED_FOR: "true"
      # Auth abuse limits — the values below MIRROR application.yml's defaults
      # (stated again here only so they are tunable from .env without a rebuild;
      # keep the two in step). The per-IP budget must fit a CROWD, because one
      # address can be a whole shop's WiFi or a carrier's CGNAT pool; guessing a
      # staff password is bounded per account by the login throttle instead, where
      # sharing an IP is irrelevant. See .env.example for when to move each.
      TOWNBASKET_RATELIMIT_CAPACITY: ${TOWNBASKET_RATELIMIT_CAPACITY:-60}
      TOWNBASKET_LOGIN_THROTTLE_MAX_FAILURES: ${TOWNBASKET_LOGIN_THROTTLE_MAX_FAILURES:-10}
      TOWNBASKET_LOGIN_THROTTLE_WINDOW: ${TOWNBASKET_LOGIN_THROTTLE_WINDOW:-PT5M}
      # Web Push (order notifications). Optional: blank leaves the channel off
      # and the apps fall back to in-app SSE. Generate once with
      # `npx web-push generate-vapid-keys` — the private key is a SECRET.
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:support@town-basket.com}
      # Product image uploads -> DO Spaces. Blank leaves upload off and the admin
      # form falls back to pasting a URL. Must be a different bucket from the
      # backups one: these objects are public, database dumps are not.
      CATALOG_IMAGES_BUCKET: ${CATALOG_IMAGES_BUCKET:-}
      CATALOG_IMAGES_ENDPOINT: ${CATALOG_IMAGES_ENDPOINT:-}
      CATALOG_IMAGES_REGION: ${CATALOG_IMAGES_REGION:-blr1}
      CATALOG_IMAGES_PUBLIC_BASE_URL: ${CATALOG_IMAGES_PUBLIC_BASE_URL:-}
      CATALOG_IMAGES_ACCESS_KEY: ${CATALOG_IMAGES_ACCESS_KEY:-}
      CATALOG_IMAGES_SECRET_KEY: ${CATALOG_IMAGES_SECRET_KEY:-}
      # Online UPI stays OFF until a real gateway replaces the fake provider,
      # which auto-succeeds and would mark orders PAID with no money received.
      UPI_ENABLED: ${UPI_ENABLED:-false}
    expose:
      - "8080"

  storefront:
    image: ${REGISTRY:?set REGISTRY in .env}/town-basket-storefront:${TAG:-latest}
    restart: unless-stopped
    # Most generous of the three frontends: it serves every customer and holds
    # the ISR render cache (`revalidate = 60` on the catalogue pages).
    mem_limit: ${STOREFRONT_MEM_LIMIT:-512m}
    environment:
      # SSR (server-side, inside this network) — a real runtime var, read by
      # getApiBaseUrl() when there is no `window`. Keeps server rendering off
      # the public hostname and out of Caddy.
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
      # The ONE public origin this shop answers on. Canonical tags, the sitemap
      # and robots.txt are all built from it, so it has to be the hostname you
      # want in search results — every other host should 301 to it. A runtime
      # value on purpose (not NEXT_PUBLIC_*): the same image serves QA and
      # production, and the public hostname is a property of the deployment.
      SITE_URL: ${SITE_URL:-https://town-basket.com}
      # Set to "true" on any deployment that must stay out of search results.
      SEO_NOINDEX: ${SEO_NOINDEX:-false}
      # NOTE: every NEXT_PUBLIC_* value (API base URL, FIREBASE_*, GOOGLE_MAPS)
      # is inlined by Next.js at IMAGE BUILD time and is INERT here — setting it
      # in this block does nothing, in the browser or on the server. CI must pass
      # them as build args when it builds this image:
      #   NEXT_PUBLIC_API_BASE_URL=https://api.town-basket.com/api/v1
      # See .env.example + apps/storefront/Dockerfile.
    expose:
      - "3000"

  admin:
    image: ${REGISTRY:?set REGISTRY in .env}/town-basket-admin:${TAG:-latest}
    restart: unless-stopped
    # A handful of staff tabs.
    mem_limit: ${ADMIN_MEM_LIMIT:-384m}
    environment:
      # SSR-side URL (container-to-container). NEXT_PUBLIC_API_BASE_URL is
      # build-time only and inert here — CI passes it as a build arg.
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
    expose:
      - "3001"

  delivery:
    image: ${REGISTRY:?set REGISTRY in .env}/town-basket-delivery:${TAG:-latest}
    restart: unless-stopped
    # A few riders' phones.
    mem_limit: ${DELIVERY_MEM_LIMIT:-384m}
    environment:
      # SSR-side URL (container-to-container). NEXT_PUBLIC_API_BASE_URL is
      # build-time only and inert here — CI passes it as a build arg.
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
    expose:
      - "3002"

  # Log shipper to Grafana Cloud. OFF unless COMPOSE_PROFILES=monitoring is set
  # in .env (see .env.example). Streams logs out; stores nothing on the droplet.
  alloy:
    # Pinned: this agent runs unattended on the droplet, and `latest`
    # means a silent major upgrade can break log shipping on a day
    # nobody is looking at Grafana. Bump deliberately.
    image: grafana/alloy:${ALLOY_VERSION:-v1.19.2}
    profiles: ["monitoring"]
    restart: unless-stopped
    # Optional and off by default, but it must never be the reason the API dies:
    # a log shipper that cannot reach Grafana buffers locally.
    mem_limit: ${ALLOY_MEM_LIMIT:-256m}
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      TB_ENV: prod
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
    volumes:
      # Read-only Docker socket to discover containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data

  # Optional self-hosted Postgres (fallback to DO Managed Database).
  # Uncomment only for a cost-sensitive single-box deployment — and re-cut the
  # memory budget above when you do: Postgres wants its own limit (start around
  # 768m) plus page cache, so lower API_MEM_LIMIT to make room rather than
  # letting the two compete for the same GB.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
  #   environment:
  #     POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  #     POSTGRES_DB: townbasket
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  alloy_data:
  # pgdata:
