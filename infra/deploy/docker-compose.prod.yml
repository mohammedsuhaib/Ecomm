# Production stack (DigitalOcean droplet). Skeleton — finalised in M6.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are pre-built and pushed by CI; ${REGISTRY} and ${TAG} come from the
# root-restricted .env on the droplet (never committed).
#
# Every var this stack CANNOT run correctly without uses ${VAR:?message}, so a
# missing or blank value stops `docker compose up` with a message naming the var
# instead of starting a half-configured production stack. Optional vars use
# ${VAR:-default} and say what the default means.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - storefront
      - admin
      - delivery

  api:
    image: ${REGISTRY:?set REGISTRY in .env}/town-basket-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      # Recommended: point at DO Managed Postgres. A blank value does NOT fall
      # back to application.yml's localhost default — Spring treats an empty env
      # var as "set", so the datasource would be misconfigured rather than local.
      DB_URL: ${DB_URL:?set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # App-issued JWT signing key — MUST be a real, random, >=32-byte secret
      # (the in-repo dev default is insecure and only for local dev).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>=32 random bytes)}
      # Set to your Firebase projectId to enable REAL phone-OTP (disables the
      # offline dev fake verifier). Blank is refused at two levels and is never
      # a silent downgrade to the fake: the guard below stops `compose up` naming
      # the var, and if the var reaches the API blank anyway PhoneVerifierMode
      # fails the boot with the property name and the fix.
      # To intentionally run the offline fake, comment this line out.
      TOWNBASKET_IDENTITY_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env (or comment out this line to run the offline fake verifier)}
      # Browser origins allowed to call the API. WITHOUT this the API keeps
      # application.yml's localhost defaults and every request from the real
      # domains is blocked by CORS — the whole site appears broken.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://shop.town-basket.com,https://admin.town-basket.com,https://delivery.town-basket.com}
      # The API is `expose`d, not published — it is reachable ONLY through Caddy,
      # which overwrites X-Forwarded-For with the real peer. Trusting it here is
      # what makes the auth rate limit per-CLIENT; left false, every request
      # looks like it comes from Caddy and one visitor can exhaust the window
      # for everyone. Do NOT set this true anywhere the API is directly reachable.
      TOWNBASKET_RATELIMIT_TRUST_FORWARDED_FOR: "true"
      # Web Push (order notifications). Optional: blank leaves the channel off
      # and the apps fall back to in-app SSE. Generate once with
      # `npx web-push generate-vapid-keys` — the private key is a SECRET.
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:support@town-basket.com}
      # Online UPI stays OFF until a real gateway replaces the fake provider,
      # which auto-succeeds and would mark orders PAID with no money received.
      UPI_ENABLED: ${UPI_ENABLED:-false}
    expose:
      - "8080"

  storefront:
    image: ${REGISTRY:?set REGISTRY in .env}/town-basket-storefront:${TAG:-latest}
    restart: unless-stopped
    environment:
      # SSR (server-side, inside this network) — a real runtime var, read by
      # getApiBaseUrl() when there is no `window`. Keeps server rendering off
      # the public hostname and out of Caddy.
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
      # NOTE: every NEXT_PUBLIC_* value (API base URL, FIREBASE_*, GOOGLE_MAPS)
      # is inlined by Next.js at IMAGE BUILD time and is INERT here — setting it
      # in this block does nothing, in the browser or on the server. CI must pass
      # them as build args when it builds this image:
      #   NEXT_PUBLIC_API_BASE_URL=https://api.town-basket.com/api/v1
      # See .env.example + apps/storefront/Dockerfile.
    expose:
      - "3000"

  admin:
    image: ${REGISTRY:?set REGISTRY in .env}/town-basket-admin:${TAG:-latest}
    restart: unless-stopped
    environment:
      # SSR-side URL (container-to-container). NEXT_PUBLIC_API_BASE_URL is
      # build-time only and inert here — CI passes it as a build arg.
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
    expose:
      - "3001"

  delivery:
    image: ${REGISTRY:?set REGISTRY in .env}/town-basket-delivery:${TAG:-latest}
    restart: unless-stopped
    environment:
      # SSR-side URL (container-to-container). NEXT_PUBLIC_API_BASE_URL is
      # build-time only and inert here — CI passes it as a build arg.
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
    expose:
      - "3002"

  # Optional self-hosted Postgres (fallback to DO Managed Database).
  # Uncomment only for a cost-sensitive single-box deployment.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  #     POSTGRES_DB: townbasket
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  # pgdata:
