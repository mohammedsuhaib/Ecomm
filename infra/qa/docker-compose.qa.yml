# QA environment — full Town Basket stack built FROM SOURCE on the QA droplet
# (no container registry needed). Fronted by Caddy with auto-TLS on the qa-*
# subdomains. Deploy loop:
#
#   cd Ecomm && git checkout main && git pull
#   cd infra/qa
#   cp .env.example .env   # first time only — then fill it in
#   docker compose -f docker-compose.qa.yml up -d --build
#
# QA intentionally keeps the DEV verifiers: fake phone OTP (dev:<phone>) and
# the fake UPI gateway, plus the seeded admin/staff/delivery accounts — that is
# what makes end-to-end testing possible without real money or SMS.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Consumed by the Caddyfile's {env.QA_BASIC_AUTH_HASH} placeholder.
      QA_BASIC_AUTH_HASH: ${QA_BASIC_AUTH_HASH:?set QA_BASIC_AUTH_HASH in .env (caddy hash-password)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - storefront
      - admin
      - delivery

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-townbasket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: townbasket
    volumes:
      - qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-townbasket} -d townbasket"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # LIST form (not a map) on purpose: the last entry is a pass-through, which
    # Compose OMITS from the container when the variable is absent. A map entry
    # would send an empty string instead, and a blank project-id is refused
    # outright (it must never be guessed as "use the fake") — so the API would
    # refuse to boot every time QA simply wanted the default. Absent stays absent.
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/townbasket
      - DB_USERNAME=${DB_USERNAME:-townbasket}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (>=32 random bytes)}
      - APP_CORS_ALLOWED_ORIGINS=https://qa.town-basket.com,https://qa-admin.town-basket.com,https://qa-delivery.town-basket.com
      - CATALOG_TRANSLITERATION_ENABLED=true
      # Phone-OTP verifier. Leave TOWNBASKET_IDENTITY_FIREBASE_PROJECT_ID OUT of
      # .env (the default) and QA keeps the offline fake, which accepts only
      # dev:<10-digit-phone>. Set it to the Firebase projectId to run the REAL
      # SMS OTP path in QA — see .env.example for the matching storefront build
      # args and Firebase console steps. A BLANK value stops the API booting.
      - TOWNBASKET_IDENTITY_FIREBASE_PROJECT_ID
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: ../..
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://qa-api.town-basket.com/api/v1
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        # Firebase Web config for the REAL phone-OTP flow. Empty is safe and is
        # the QA default: isFirebaseConfigured() needs apiKey AND projectId, so
        # blank leaves the storefront sending dev:<phone> to the fake verifier.
        # Set these together with the API's projectId — one side alone gives a
        # storefront that requests a real SMS the backend then rejects, or vice
        # versa. Build args, so changing them needs `up -d --build storefront`.
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    restart: unless-stopped
    environment:
      # SSR-side URL (container-to-container).
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
    expose:
      - "3000"
    depends_on:
      - api

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://qa-api.town-basket.com/api/v1
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
    expose:
      - "3001"
    depends_on:
      - api

  delivery:
    build:
      context: ../..
      dockerfile: apps/delivery/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://qa-api.town-basket.com/api/v1
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
    expose:
      - "3002"
    depends_on:
      - api

  # Log shipper to Grafana Cloud. OFF unless COMPOSE_PROFILES=monitoring is set
  # in .env (see .env.example). Streams logs out; stores nothing on the droplet.
  alloy:
    image: grafana/alloy:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      TB_ENV: qa
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
    volumes:
      # Read-only Docker socket to discover containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  qa_pgdata:
  caddy_data:
  caddy_config:
  alloy_data:
